name: Build APK

# Manual build of any branch, tag or commit. Run it from the Actions tab:
# "Build APK" -> "Run workflow", then type the branch to build.
#
# debug   -> APK uploaded as a run artifact only.
# release -> signed APK named VZtats-v<version>.apk, plus a GitHub Release
#            (draft by default) whose notes come from docs/releases/<version>.md.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag or commit SHA to build
        required: true
        default: main
        type: string
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      draft:
        description: "Release only: create the GitHub Release as a draft (publish it by hand after checking)"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Release only: mark the GitHub Release as a pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.branch }}-${{ inputs.build_type }}
  cancel-in-progress: true

# Toolchain versions. Keep these in sync with app/build.gradle.kts
# (compileSdk, buildToolsVersion, ndkVersion, cmake version) and
# docs/BUILDING.md (JDK 17-21).
env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "36"
  BUILD_TOOLS_VERSION: "36.1.0"
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: ${{ inputs.build_type }} @ ${{ inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      artifact: ${{ steps.apk.outputs.artifact }}
      apk_name: ${{ steps.apk.outputs.apk_name }}
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - name: Check out ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Read version
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          # Tags follow the existing convention: the bare version, e.g. "0.1".
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Fail in seconds, not after a 10-minute build, when a release can't be
      # published anyway.
      - name: Check release prerequisites
        if: inputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          BRANCH: ${{ inputs.branch }}
        run: |
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error file=app/build.gradle.kts::No release notes for ${VERSION}. Add ${NOTES} (see docs/BUILDING.md), or bump versionName if ${VERSION} is already released."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error file=app/build.gradle.kts::Tag ${TAG} already exists. Bump versionName and versionCode in app/build.gradle.kts before releasing."
            exit 1
          fi
          if [ "$BRANCH" != "main" ]; then
            echo "::warning::Releasing from '${BRANCH}', not main."
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The runner image ships the Android command-line tools; only the exact
      # platform / build-tools / NDK / CMake versions the project pins are added.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Release signing is optional for the build itself. With the four
      # VZTATS_* secrets set, the release APK is signed; without them the
      # build still succeeds, but no GitHub Release is created, because an
      # unsigned APK can't be installed.
      - name: Prepare release keystore
        id: signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.VZTATS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VZTATS_STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.VZTATS_KEYALIAS }}
          KEY_PASSWORD: ${{ secrets.VZTATS_KEYPASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets not set - building an unsigned release APK. No GitHub Release will be created."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/vztats-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "VZTATS_STOREFILE=$KEYSTORE"
            echo "VZTATS_STOREPASSWORD=$STORE_PASSWORD"
            echo "VZTATS_KEYALIAS=$KEY_ALIAS"
            echo "VZTATS_KEYPASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # gradle.properties pins org.gradle.java.home to a local Windows JDK path
      # for the maintainer's machine. A -D flag on the command line takes
      # precedence over the project's gradle.properties, so CI points Gradle at
      # the JDK installed above without touching that local setup.
      - name: Build ${{ inputs.build_type }} APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" "$TASK"

      - name: Verify release signature
        if: inputs.build_type == 'release' && steps.signing.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      # Gradle always names the file app-<type>.apk; give it a name that says
      # what it is once it leaves the build machine.
      - name: Name APK
        id: apk
        env:
          BRANCH: ${{ inputs.branch }}
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          SRC=$(ls app/build/outputs/apk/${BUILD_TYPE}/*.apk | head -n1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          # File and artifact names may not contain "/", so feature/foo -> feature-foo.
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/\\:<>|*?"' '-')
          if [ "$BUILD_TYPE" = "release" ] && [ "$SIGNED" = "true" ]; then
            APK="VZtats-v${VERSION}.apk"
            ARTIFACT="VZtats-v${VERSION}"
          elif [ "$BUILD_TYPE" = "release" ]; then
            APK="VZtats-v${VERSION}-unsigned.apk"
            ARTIFACT="VZtats-v${VERSION}-unsigned"
          else
            APK="VZtats-v${VERSION}-debug-${SAFE_BRANCH}-${SHORT_SHA}.apk"
            ARTIFACT="VZtats-v${VERSION}-debug-${SAFE_BRANCH}-${SHORT_SHA}"
          fi
          mkdir -p dist
          cp "$SRC" "dist/$APK"
          echo "apk_name=$APK" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          {
            echo "### VZtats ${VERSION} (${BUILD_TYPE})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| APK | \`${APK}\` |"
            echo "| SHA-256 | \`$(sha256sum "dist/$APK" | cut -d' ' -f1)\` |"
            if [ "$BUILD_TYPE" = "release" ] && [ "$SIGNED" != "true" ]; then
              echo ""
              echo "> Unsigned: no GitHub Release was created. Add the VZTATS_* signing secrets to publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: dist/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vztats-release.jks"

  # Separate job so only publishing gets write access to the repository.
  publish:
    name: Publish GitHub Release
    needs: build
    if: inputs.build_type == 'release' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          APK: ${{ needs.build.outputs.apk_name }}
          BRANCH: ${{ inputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SIZE_MB=$(du -m "dist/$APK" | cut -f1)
          SHA256=$(sha256sum "dist/$APK" | cut -d' ' -f1)
          {
            # Hand-written, user-facing notes for this version.
            cat "docs/releases/${VERSION}.md"
            echo ""
            echo "## Download"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            echo "| \`${APK}\` | ${SIZE_MB} MB | \`${SHA256}\` |"
            echo ""
            echo "Built from \`${SHA:0:7}\` on \`${BRANCH}\` by [this workflow run](${RUN_URL}), signed with the VZtats release key."
            echo ""
            # Commit/PR list since the previous release, generated by GitHub.
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          APK: ${{ needs.build.outputs.apk_name }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # A draft doesn't create its tag until published, so the tag check in
          # the build job can't see an earlier draft for the same version.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists (possibly a draft). Delete it or bump versionName."
            exit 1
          fi
          FLAGS=()
          if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "dist/$APK" \
            --target "$SHA" \
            --title "VZtats v${VERSION}" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"
